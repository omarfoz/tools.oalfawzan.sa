<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Wheel of Names — tools.oalfawzan.sa</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="description" content="عجلة أسماء بسيطة لاختيار اسم عشوائي بسرعة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/pages/wheel-of-names.css">
<link rel="stylesheet" href="/assets/css/platform.css">
</head>
<body>
<a class="skip-link" href="#main-content">تجاوز إلى المحتوى</a>
<main class="wrap" id="main-content">
  <header>
    <a href="/" class="logo">tools.<span>oalfawzan.sa</span></a>
    <div class="header-actions">
      <button class="lang-btn" id="langBtn" type="button">EN</button>
      <button class="lang-btn" id="themeBtn" data-platform-theme-toggle type="button" aria-label="تبديل المظهر"></button>
      <a href="/" class="logo" id="backLink">← الرجوع لكل الأدوات</a>
    </div>
  </header>

  <div class="hero-tag" id="tag">// أداة</div>
  <h1 id="title">Wheel of Names</h1>
  <p class="sub" id="desc">أدخل الأسماء (كل اسم في سطر) ثم لف العجلة لاختيار اسم عشوائي.</p>

  <section class="grid" aria-labelledby="title">
    <div class="panel">
      <label class="field-label" id="namesLabel" for="namesInput">الأسماء</label>
      <textarea id="namesInput" placeholder="أحمد&#10;سارة&#10;ليلى"></textarea>
      <div class="actions">
        <button class="btn primary" id="spinBtn" type="button">لف العجلة</button>
        <button class="btn" id="resetBtn" type="button">إعادة تعيين</button>
      </div>
      <div class="result" id="resultText" role="status" aria-live="polite"></div>
    </div>

    <div class="panel wheel-wrap" role="group" aria-label="Name wheel preview">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheelCanvas" width="460" height="460" role="img" aria-label="Interactive name wheel visualization"></canvas>
    </div>
  </section>

  <footer><span id="builtBy">من تطوير</span> <a href="https://oalfawzan.sa" class="logo footer-link">Omar Alfawzan</a></footer>
</main>

<script src="/assets/js/platform.js"></script>
<script src="/assets/js/pages/wheel-of-names.js"></script>
</body>
</html>
