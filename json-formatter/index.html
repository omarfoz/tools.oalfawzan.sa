<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>JSON Formatter — tools.oalfawzan.sa</title>
<script>try{const t=localStorage.getItem('tools-theme')||localStorage.getItem('tools_theme');const l=localStorage.getItem('tools-language')||localStorage.getItem('tools_lang')||localStorage.getItem('offer_lang');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(l==='ar'||l==='en'){document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr'}}catch(e){}</script>
<meta name="theme-color" content="#0a0a0f">
<meta name="description" content="منسق JSON سريع للنسخ والتحقق." />
<link rel="stylesheet" href="/assets/css/pages/json-formatter.css">
<link rel="stylesheet" href="/assets/css/platform.css">
<link rel="stylesheet" href="/assets/css/home-parity.css">
<link rel="stylesheet" href="/assets/css/design-system.css">
<link rel="stylesheet" href="/assets/css/design-taste.css">
</head>
<body class="tool-page">
<a class="skip-link" href="#main-content">تجاوز إلى المحتوى</a>
<div class="wrap" id="main-content" role="main">
<header class="site-header tool-site-header">
  <a href="/" class="brand" aria-label="tools.oalfawzan.sa home"><span class="brand-mark" aria-hidden="true">OF</span><span class="brand-text"><strong>tools.</strong>oalfawzan.sa</span></a>
  <div class="header-actions">
    <button class="lang-btn" id="langBtn" type="button">EN</button>
    <button class="lang-btn" id="themeBtn" type="button">☀️</button>
    <a href="/" class="logo" id="backLink">← الرجوع لكل الأدوات</a>
  </div>
</header>
<div class="hero-tag" id="tag">// أداة</div>
<h1 id="title">JSON Formatter</h1>
<p class="sub" id="desc">ألصق JSON، ثم نسّقه أو صغّره وتحقق من صحته فورًا.</p>
<section class="panel">
  <div class="actions">
    <button class="btn primary" id="formatBtn" type="button">تنسيق</button>
    <button class="btn" id="minifyBtn" type="button">تصغير</button>
    <button class="btn" id="copyBtn" type="button">نسخ الناتج</button>
    <button class="btn" id="clearBtn" type="button">مسح</button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="editors">
    <textarea id="inputJson" placeholder='{"project":"tools"}' aria-label="JSON input"></textarea>
    <textarea id="outputJson" aria-live="polite" readonly aria-label="Formatted JSON output"></textarea>
  </div>
</section>
<footer><span id="builtBy">من تطوير</span> <a href="https://oalfawzan.sa" class="logo" style="font-size:.72rem">Omar Alfawzan</a></footer>
</div>
<script defer src="/assets/js/pages/json-formatter.js"></script>
<script defer src="/assets/js/platform.js"></script>
</body>
</html>
