<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>QR Generator — tools.oalfawzan.sa</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="description" content="مولد QR سريع مع خيار تنزيل الصورة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/pages/qr-generator.css">
<link rel="stylesheet" href="/assets/css/platform.css">
</head>
<body>
<a class="skip-link" href="#main-content">تجاوز إلى المحتوى</a>
<main class="wrap" id="main-content">
  <header>
    <a href="/" class="logo">tools.<span>oalfawzan.sa</span></a>
    <div class="header-actions">
      <button class="lang-btn" id="langBtn" type="button">EN</button>
      <button class="lang-btn" id="themeBtn" data-platform-theme-toggle type="button" aria-label="تبديل المظهر"></button>
      <a href="/" class="logo" id="backLink">← الرجوع لكل الأدوات</a>
    </div>
  </header>

  <div class="hero-tag" id="tag">// أداة</div>
  <h1 id="title">QR Code Generator</h1>
  <p class="sub" id="desc">اكتب نصًا أو رابطًا، ثم أنشئ رمز QR قابلًا للتنزيل.</p>

  <section class="panel" aria-labelledby="title">
    <div>
      <label class="field-label" id="qrTextLabel" for="qrText">النص أو الرابط</label>
      <textarea id="qrText" placeholder="https://tools.oalfawzan.sa" spellcheck="false"></textarea>
      <div class="helper" id="helper">يدعم الروابط والنصوص العادية.</div>
      <div class="actions">
        <button class="btn primary" id="generateBtn" type="button">إنشاء QR</button>
        <button class="btn" id="downloadBtn" type="button">تنزيل PNG</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
    <div class="qr-box" role="img" aria-label="QR code preview">
      <canvas id="qrCanvas" width="260" height="260" aria-hidden="true"></canvas>
    </div>
  </section>
  <footer><span id="builtBy">من تطوير</span> <a href="https://oalfawzan.sa" class="logo footer-link">Omar Alfawzan</a></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script src="/assets/js/platform.js"></script>
<script src="/assets/js/pages/qr-generator.js"></script>
</body>
</html>
