name: Offer page cross-browser QA
on:
  push:
    paths:
      - "offer/**"
      - "scripts/offer-browser.test.cjs"
      - ".github/workflows/offer-browser-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Serve static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/offer-http.log 2>&1 &
          sleep 2
      - name: Test Arabic and English, mobile/desktop, calculations, migration and export
        run: node scripts/offer-browser.test.cjs
      - name: Save rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offer-ui-screenshots
          path: test-output/
          if-no-files-found: ignore
