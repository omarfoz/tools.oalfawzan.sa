name: Fix Offer Accessibility SEO

on:
  push:
    branches:
      - fix-offer-accessibility-seo
    paths:
      - .github/workflows/fix-offer-a11y-seo.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-offer-accessibility-seo
      - name: Install Lighthouse
        run: npm install -g lighthouse@13.4.1
      - name: Run local server
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/offer-server.log 2>&1 &
          sleep 2
      - name: Inspect remaining Offer accessibility audits
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/offer.json
          lighthouse "http://127.0.0.1:8080/offer/" \
            --quiet \
            --only-categories=accessibility,seo \
            --output=json \
            --output-path="$out" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --max-wait-for-load=45000
          node - "$out" <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for (const name of ['accessibility','seo']) {
            const cat=j.categories[name];
            console.log(`${name.toUpperCase()} SCORE: ${Math.round((cat.score||0)*100)}`);
            for (const ref of cat.auditRefs) {
              const a=j.audits[ref.id];
              if (!a || a.score === 1 || a.score === null) continue;
              console.log(`FAIL\t${name}\t${ref.id}\t${a.title}`);
              for (const item of (a.details?.items || [])) {
                const node=item.node || item;
                const text=node.snippet || node.selector || node.nodeLabel || item.href || JSON.stringify(item);
                console.log(`ITEM\t${String(text).replace(/\s+/g,' ').slice(0,700)}`);
              }
            }
          }
          NODE
