name: Fix Offer Accessibility SEO

on:
  push:
    branches:
      - fix-offer-accessibility-seo
    paths:
      - .github/workflows/fix-offer-a11y-seo.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-offer-accessibility-seo
      - name: Install Lighthouse
        run: npm install -g lighthouse@13.4.1
      - name: Run local server
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/offer-server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8080/offer/ >/dev/null
      - name: Validate Offer accessibility SEO and performance
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/offer.json
          lighthouse "http://127.0.0.1:8080/offer/" \
            --quiet \
            --only-categories=performance,accessibility,seo \
            --output=json \
            --output-path="$out" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --max-wait-for-load=45000
          node - "$out" <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const scores={};
          for (const name of ['performance','accessibility','seo']) {
            scores[name]=Math.round((j.categories[name].score||0)*100);
            console.log(`${name.toUpperCase()} SCORE: ${scores[name]}`);
            for (const ref of j.categories[name].auditRefs) {
              const a=j.audits[ref.id];
              if (a && a.score !== 1 && a.score !== null) console.log(`FAIL\t${name}\t${ref.id}\t${a.score}\t${a.title}`);
            }
          }
          if (scores.accessibility !== 100 || scores.seo !== 100 || scores.performance < 95) process.exit(1);
          NODE
