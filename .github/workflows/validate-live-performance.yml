name: Validate Live Performance

on:
  push:
    branches:
      - validate-all-pages-performance
    paths:
      - .github/workflows/validate-live-performance.yml

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lighthouse
        run: npm install -g lighthouse@13.4.1

      - name: Inspect Offer accessibility and SEO
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/offer-a11y-seo.json
          lighthouse "https://tools.oalfawzan.sa/offer/" \
            --quiet \
            --only-categories=accessibility,seo \
            --output=json \
            --output-path="$out" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --max-wait-for-load=45000
          node - "$out" <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for (const catName of ['accessibility','seo']) {
            const cat=j.categories[catName];
            console.log(`\n${catName.toUpperCase()} SCORE: ${Math.round((cat.score||0)*100)}`);
            for (const ref of cat.auditRefs) {
              const a=j.audits[ref.id];
              if (a && a.score !== 1 && a.score !== null) {
                console.log(`FAIL\t${ref.id}\t${a.score}\t${a.title}${a.displayValue ? '\t'+a.displayValue : ''}`);
                const items=a.details?.items || [];
                for (const item of items.slice(0,8)) {
                  const node=item.node || item;
                  const snippet=node.snippet || node.selector || node.explanation || item.href || item.source || '';
                  if (snippet) console.log(`ITEM\t${String(snippet).replace(/\s+/g,' ').slice(0,500)}`);
                }
              }
            }
          }
          NODE
