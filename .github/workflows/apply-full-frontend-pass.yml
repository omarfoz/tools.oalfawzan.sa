name: Apply Full Frontend Pass

on:
  push:
    branches:
      - audit/full-frontend-validation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-frontend-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply frontend pass
        run: python scripts/apply_full_frontend_pass.py
      - name: Syntax check JavaScript
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 404.html assets loan-calculator index.html
          git commit -m 'Apply repository-wide frontend quality pass'
          git push origin HEAD:audit/full-frontend-validation
