name: Full UI Audit

on:
  push:
    branches:
      - audit/full-frontend-validation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser QA dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tools-ui-server.log 2>&1 &
          echo $! > /tmp/tools-ui-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tools-ui-server.log
          exit 1

      - name: Run repository UI audit
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173
        run: node scripts/full_ui_audit.mjs

      - name: Show report
        if: always()
        run: |
          test -f .ui-audit/REPORT.md && cat .ui-audit/REPORT.md || true
          test -f /tmp/tools-ui-server.log && tail -100 /tmp/tools-ui-server.log || true

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-ui-audit
          path: .ui-audit/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
